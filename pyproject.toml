[project]
name = "qsar-ml-tutoriais"
version = "0.1.0"
description = "Tutoriais pedagogicos de QSAR com aprendizado de maquina: SMILES/fingerprints, classificacao e regressao com interpretabilidade."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "shap>=0.44",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]
# Necessario apenas para regenerar as amostras a partir do ChEMBL.
data = [
    "chembl-webresource-client>=0.10.9",
    "requests>=2.31",
]

[tool.ruff]
line-length = 88
target-version = "py310"
